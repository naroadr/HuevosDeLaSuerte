<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclosionar Mis Huevos - RyuuzZ_</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <button id="theme-toggle" class="theme-toggle-btn" title="Cambiar modo claro/oscuro">
        <img id="theme-icon" src="imagenes/luna.png" alt="Cambiar tema">
    </button>

    <header>
        <h1>¡Eclosiona tus huevos de la suerte!</h1>
        <p class="subtitle">Abre tus huevos de la suerte y descubre tus recompensas</p>
    </header>

    <main class="hatch-main">
        <!-- Selector del tipo de huevo a eclosionar -->
        <div class="egg-selector">
            <label for="egg-type-select" class="subtitle">Elige el huevo a abrir:</label>
            <select id="egg-type-select" class="guide-btn" style="cursor: pointer; margin-left: 10px;">
                <option value="roto">Huevos Rotos</option>
                <option value="comun">Huevos Comunes</option>
                <option value="pcomun">Huevos Poco Comunes</option>
                <option value="raro">Huevos Raros</option>
                <option value="epico">Huevos Épicos</option>
                <option value="legendario">Huevos Legendarios</option>
            </select>
        </div>

        <!-- Huevo eclosión -->
        <div class="hatch-arena">
            <div id="egg-container" class="pokemon-egg-wrapper">
                <div id="egg-display" class="egg-visual">🥚</div>
            </div>
            <button id="hatch-btn" class="guide-btn">¡ECLOSIONAR HUEVO!</button>
            <div id="hatch-result" class="slot-result"></div>
        </div>

        <div class="back-link-container">
        <a href="index.html" class="nav-btn">Volver al Inventario</a>
        </div>
    </main>

    <div class="bg-eggs-container" id="bg-eggs"></div>
    <script src="eclosionar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclosionar Mis Huevos - RyuuzZ_</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="extra.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
</head>
<body class="page-hatch">
  <div class="user-menu-container">
    <div id="top-username-container" class="top-username" tabindex="0">👤 <span id="display-username">Invitado</span> ▼</div>
    <div id="user-dropdown" class="dropdown-menu"><a href="#" id="auth-action-btn">Iniciar sesión con Twitch</a></div>
  </div>
  <button id="theme-toggle" class="theme-toggle-btn" title="Cambiar modo claro/oscuro" aria-label="Cambiar tema">
    <img id="theme-icon" src="imagenes/luna.png" alt="">
  </button>

  <header>
    <h1>¡Eclosiona tus huevos de la suerte!</h1>
    <p class="subtitle">Cada eclosión abre un huevo al azar de tu inventario</p>
  </header>

  <main class="hatch-main">
    <div class="hatch-arena">
      <div id="egg-stock" class="egg-stock"></div>
      <div class="pokemon-egg-wrapper"><div id="egg-display" class="egg-visual">🥚</div></div>
      <button id="hatch-btn" class="guide-btn" disabled>¡ECLOSIONAR HUEVO!</button>
      <div id="hatch-result" class="slot-result" aria-live="polite"></div>
      <div id="fragment-result" class="fragment-result"></div>
      <div class="back-link-container"><a href="index.html" class="nav-btn">Volver al inventario</a></div>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <div class="bg-eggs-container" id="bg-eggs"></div>
  <script src="common.js"></script>
  <script src="eclosionar.js"></script>
</body>
</html>
